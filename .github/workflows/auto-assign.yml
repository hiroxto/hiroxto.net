name: Auto Assign

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

jobs:
  auto-assign:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Assign PR author
        run: gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --add-assignee "$PR_AUTHOR"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
