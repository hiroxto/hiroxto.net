name: CI

on:
    pull_request:

jobs:
    install:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup mise
                uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

            -   name: Cache npm
                uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.npm
                        node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'mise.toml') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Install safe-chain
                run: curl -fsSL https://raw.githubusercontent.com/AikidoSec/safe-chain/main/install-scripts/install-safe-chain.sh | sh -s -- --ci

            -   name: Install dependencies
                run: npm ci

    test:
        needs: install
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup mise
                uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

            -   name: Restore dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.npm
                        node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'mise.toml') }}
                    fail-on-cache-miss: true

            -   name: Run Test
                run: npm run test

    lint:
        needs: install
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup mise
                uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

            -   name: Restore dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.npm
                        node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'mise.toml') }}
                    fail-on-cache-miss: true

            -   name: Run lint
                run: npm run lint

    format:
        needs: install
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup mise
                uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

            -   name: Restore dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.npm
                        node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'mise.toml') }}
                    fail-on-cache-miss: true

            -   name: Run format
                run: npm run format

    type-check:
        needs: install
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup mise
                uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

            -   name: Restore dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.npm
                        node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'mise.toml') }}
                    fail-on-cache-miss: true

            -   name: Type Check
                run: npm run check

    build:
        needs: install
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup mise
                uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

            -   name: Restore dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.npm
                        node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'mise.toml') }}
                    fail-on-cache-miss: true

            -   name: Run build
                run: npm run build:cf

    check-generated-content:
        needs: install
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup mise
                uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

            -   name: Restore dependencies
                uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
                with:
                    path: |
                        ~/.npm
                        node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json', 'mise.toml') }}
                    fail-on-cache-miss: true

            -   name: Check generated content
                run: npm run check:train-number-content
